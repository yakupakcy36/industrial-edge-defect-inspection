version: '3.8'

services:
  edge-defect-inspection-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edge-defect-inspector
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
